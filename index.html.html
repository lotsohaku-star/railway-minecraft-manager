<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>鉄道マイクラ体験｜運営管理システム</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#121e2a;--panel2:#172635;--line:#2a3b4b;--muted:#9db0c1;--text:#edf4fa;--cyan:#55d6e8;--green:#43d39e;--yellow:#f4c95d;--red:#ff7474;--blue:#78aaff;--shadow:0 10px 30px #0004}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1118,#101d29 55%,#0b1118);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#203447;color:var(--text);font-weight:700;min-height:42px}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#087f91;border-color:#1aa6b7}.success{background:#126b50;border-color:#238b6b}.warning{background:#76551a;border-color:#a77b27}.danger{background:#782f37;border-color:#a84852}.ghost{background:transparent}.small{padding:7px 10px;min-height:34px;font-size:13px}.muted{color:var(--muted)}.tiny{font-size:12px}.mono,.clock,.timer{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em}.topbar{position:sticky;top:0;z-index:10;background:#0d1722ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1500px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#0d8297,#1e4969);display:grid;place-items:center;font-size:22px}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}.topmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.clock{font-size:22px;font-weight:800;color:var(--cyan)}.connection{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:20px}.connection.off{color:var(--yellow);border-color:#8a6c2d}.shell{max-width:1500px;margin:auto;padding:18px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:14px;margin-bottom:8px}.nav button{white-space:nowrap;background:#142331}.nav button.active{background:#087f91;border-color:#35c4d3}.eventbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 15px;margin-bottom:16px;background:#122536;border:1px solid #28475c;border-radius:14px}.eventbar strong{color:var(--cyan)}.event-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric,.panel,.zone-card,.ipad-card,.group-card,.notice{background:linear-gradient(155deg,#172635,#111c27);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.metric{padding:15px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:29px;font-weight:800;margin-top:5px}.metric .sub{font-size:12px;color:var(--muted);margin-top:3px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}.section-head h2{font-size:18px;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.zone-card,.ipad-card,.group-card{padding:15px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card-head h3{margin:0;font-size:17px}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:30px;font-size:12px;font-weight:800;border:1px solid var(--line);white-space:nowrap}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.st-free{color:var(--green);background:#12382e}.st-active{color:var(--cyan);background:#103642}.st-paused{color:var(--yellow);background:#3c3016}.st-done{color:#aeb9c4;background:#293541}.st-alert{color:var(--red);background:#411e27}.timer{font-size:32px;font-weight:850;margin:12px 0 5px}.timer.warn{color:var(--yellow)}.timer.over{color:var(--red)}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.detail{padding:8px;background:#0d1822;border-radius:9px}.detail .k{font-size:11px;color:var(--muted)}.detail .v{font-weight:700;margin-top:3px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.panel{padding:16px;margin-bottom:14px}.panel h3{margin:0 0 12px;font-size:16px}.formrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0c1721;color:var(--text);border:1px solid #34495b;border-radius:9px;padding:10px 11px;min-height:42px}input:focus,select:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.notice{padding:12px 14px;margin-bottom:9px;border-left:4px solid var(--yellow)}.notice.critical{border-left-color:var(--red)}.notice.info{border-left-color:var(--cyan)}.notice-top{display:flex;justify-content:space-between;gap:10px}.notice p{margin:6px 0;color:#d4e0e9}.notice time{font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border-radius:20px;background:#263b4d;color:#c9d8e5;font-size:11px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #3a4c5d;border-radius:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.setting-item{padding:12px 0;border-bottom:1px solid #263847}.setting-item:last-child{border:0}.setting-item h4{margin:0 0 8px}.help{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}.footer{color:#71879a;text-align:center;font-size:11px;padding:24px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#eaf5fb;color:#10202c;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:700;max-width:90vw}.hidden{display:none!important}.tagline{font-size:12px;color:var(--muted)}.progress{height:7px;background:#263746;border-radius:9px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:var(--cyan);width:0}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #263847}.list-row:last-child{border:0}.qr-link{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--cyan)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
@media(max-width:560px){.shell{padding:12px}.topbar{padding:10px 12px}.brand h1{font-size:14px}.brand small{font-size:10px}.logo{width:36px;height:36px}.clock{font-size:18px}.grid{gap:8px}.metric{padding:11px}.metric .value{font-size:23px}.metric .label{font-size:11px}.timer{font-size:28px}.details{gap:6px}.eventbar{align-items:flex-start}.event-actions{width:100%}.event-actions button{flex:1}}
</style>
</head>
<body>
<header class="topbar"><div class="toprow"><div class="brand"><div class="logo">🚆</div><div><h1>鉄道マイクラ体験 <span class="muted">運営管理</span></h1><small>OPERATIONS CONTROL SYSTEM</small></div></div><div class="topmeta"><span id="connection" class="connection">● オンライン</span><div><div id="clock" class="clock">--:--:--</div><div id="today" class="tiny muted" style="text-align:right"></div></div></div></div></header>
<main class="shell">
<nav class="nav" id="nav"><button data-page="dashboard" class="active">▦ 運行状況</button><button data-page="zones">▣ 体験区画</button><button data-page="groups">♟ グループ・受付</button><button data-page="ipads">▤ iPad管理</button><button data-page="notices">🔔 通知センター <span id="navUnread"></span></button><button data-page="settings">⚙ 設定・データ</button></nav>
<section class="eventbar"><div><div class="tiny muted">EVENT STATUS</div><strong id="eventStatus">未開始</strong><div class="tiny muted" id="eventDetail">イベント開始前です</div></div><div class="event-actions"><button class="primary" id="eventStartBtn">▶ イベント開始</button><button class="warning" id="eventEndBtn" disabled>■ イベント終了</button></div></section>
<div id="view"></div>
<div class="footer">LOCAL CONTROL MODE ｜ データはこのブラウザ内に保存されます。複数端末同期は未実装です。</div>
</main><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const STORAGE_KEY='railwayMinecraftManager_v1';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')};
const dateTime=t=>t?new Date(t).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const durationText=ms=>fmt(ms);
function freshState(){return {version:1,settings:{standardMin:15,warningMin:20,eventEndAt:'',eventNoticeMin:10,ipadLongLoanMin:60},event:{status:'idle',startAt:null,endAt:null,noticeSent:false},zones:[{id:uid(),name:'区画1',status:'free',groupId:null,startAt:null,elapsedMs:0,finishedAt:null,finalMs:null,notified:{standard:false,warning:false},standardOverride:null,warningOverride:null},{id:uid(),name:'区画2',status:'free',groupId:null,startAt:null,elapsedMs:0,finishedAt:null,finalMs:null,notified:{standard:false,warning:false},standardOverride:null,warningOverride:null}],groups:[],nextGroupNo:1,ipads:[1,2,3,4].map(n=>({id:uid(),name:'iPad '+n,onLoan:false,charging:false,unusable:false,loanAt:null,returnAt:null,groupId:null,loanNoticeSent:false})),notices:[],history:[]}}
let state=freshState(),page='dashboard',toastTimer=null;
function normalizeLoaded(x){if(!x||x.version!==1||!Array.isArray(x.zones)||!Array.isArray(x.groups)||!Array.isArray(x.ipads)||!x.settings||!x.event)throw new Error('保存データの形式が正しくありません');const d=freshState();return {...d,...x,settings:{...d.settings,...x.settings},event:{...d.event,...x.event},zones:x.zones.map(z=>({...d.zones[0],...z,notified:{standard:false,warning:false,...z.notified}})),groups:x.groups.map(g=>({...g})),ipads:x.ipads.map(p=>({...d.ipads[0],...p})),notices:Array.isArray(x.notices)?x.notices:[],history:Array.isArray(x.history)?x.history:[]}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){showToast('保存できません。ブラウザの保存容量を確認してください');return false}}
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=normalizeLoaded(JSON.parse(raw))}catch(e){console.error(e);state=freshState();setTimeout(()=>showToast('保存データを読み込めませんでした。初期状態で起動しました'),300)}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)}
function addNotice(type,title,message,targetId=null){state.notices.unshift({id:uid(),type,title,message,targetId,at:now(),read:false});if(state.notices.length>500)state.notices.length=500;save();}
function groupById(id){return state.groups.find(g=>g.id===id)}
function zoneById(id){return state.zones.find(z=>z.id===id)}
function ipadById(id){return state.ipads.find(p=>p.id===id)}
function elapsed(z){return (z.elapsedMs||0)+(z.status==='active'&&z.startAt?Math.max(0,now()-z.startAt):0)}
function groupElapsed(g){const z=g.zoneId?zoneById(g.zoneId):null;return z?elapsed(z):(g.finalMs||g.elapsedMs||0)}
function effectiveTimes(z,g){return {standard:(g?.standardOverride??z?.standardOverride??state.settings.standardMin)*60000,warning:(g?.warningOverride??z?.warningOverride??state.settings.warningMin)*60000}}
function timeClass(ms,warning){return ms>=warning?'over':ms>=state.settings.standardMin*60000?'warn':''}
function statusClass(s){return ({free:'st-free',active:'st-active',paused:'st-paused',finished:'st-done',done:'st-done',waiting:'st-paused',cancelled:'st-done',loan:'st-active',unusable:'st-alert'})[s]||'st-free'}
function statusLabel(s){return ({free:'空き',active:'使用中',paused:'一時停止',finished:'終了',registered:'受付済み',waiting:'待機中',done:'体験終了',cancelled:'キャンセル'})[s]||s}
function activeGroups(){return state.groups.filter(g=>['active','paused'].includes(g.status))}
function unassignedWaiting(){return state.groups.filter(g=>['registered','waiting'].includes(g.status)&&!g.zoneId)}
function groupOptionList(selected=''){return '<option value="">グループを選択</option>'+unassignedWaiting().map(g=>`<option value="${g.id}" ${g.id===selected?'selected':''}>#${g.no} ${esc(g.name||'（名称なし）')}</option>`).join('')}
function render(){renderHeader();const root=$('#view');if(page==='dashboard')root.innerHTML=dashboardHTML();if(page==='zones')root.innerHTML=zonesHTML();if(page==='groups')root.innerHTML=groupsHTML();if(page==='ipads')root.innerHTML=ipadsHTML();if(page==='notices')root.innerHTML=noticesHTML();if(page==='settings')root.innerHTML=settingsHTML();}
function renderHeader(){const c=$('#connection');const online=navigator.onLine;c.textContent=online?'● オンライン（ローカル保存）':'● オフライン（ローカル保存）';c.classList.toggle('off',!online);$('#navUnread').textContent=state.notices.some(n=>!n.read)?'●':'';const e=state.event;$('#eventStatus').textContent=({idle:'未開始',running:'運行中',ended:'終了'})[e.status];$('#eventDetail').textContent=e.status==='running'?`開始 ${dateTime(e.startAt)} ／ 経過 ${fmt(now()-e.startAt)} ／ 終了予定 ${e.endAt?dateTime(e.endAt):'未設定'} ／ 残り ${e.endAt?fmt(e.endAt-now()):'—'}`:e.status==='ended'?`終了 ${dateTime(e.endAt)}`:'イベント開始前です';$('#eventStartBtn').disabled=e.status==='running';$('#eventStartBtn').textContent=e.status==='ended'?'↻ 再開始':'▶ イベント開始';$('#eventEndBtn').disabled=e.status!=='running'}
function dashboardHTML(){const busy=state.zones.filter(z=>['active','paused'].includes(z.status)).length,free=state.zones.filter(z=>z.status==='free').length,loan=state.ipads.filter(p=>p.onLoan).length,charging=state.ipads.filter(p=>p.charging).length,unread=state.notices.filter(n=>!n.read).length,over=state.zones.filter(z=>z.status==='active'&&elapsed(z)>=effectiveTimes(z,groupById(z.groupId)).warning).length,returnWait=state.ipads.filter(p=>p.onLoan).length;
return `<div class="grid"><div class="metric"><div class="label">体験中・一時停止</div><div class="value">${busy}<small class="muted"> / ${state.zones.length}</small></div><div class="sub">稼働中の区画・グループ</div></div><div class="metric"><div class="label">空き区画</div><div class="value">${free}</div><div class="sub">すぐに割り当て可能</div></div><div class="metric"><div class="label">貸出中 iPad</div><div class="value">${loan}</div><div class="sub">返却待ち ${returnWait} 台</div></div><div class="metric"><div class="label">充電中 iPad</div><div class="value">${charging}</div><div class="sub">貸出中の充電 ${state.ipads.filter(p=>p.onLoan&&p.charging).length} 台</div></div><div class="metric"><div class="label">未確認通知</div><div class="value">${unread}</div><div class="sub">通知センターで確認</div></div><div class="metric"><div class="label">警告時間超過</div><div class="value" style="color:${over?'var(--red)':'var(--green)'}">${over}</div><div class="sub">警告時間を超えた体験</div></div><div class="metric"><div class="label">待機グループ</div><div class="value">${unassignedWaiting().length}</div><div class="sub">受付済み・待機中</div></div><div class="metric"><div class="label">登録 iPad</div><div class="value">${state.ipads.length}</div><div class="sub">使用不可 ${state.ipads.filter(p=>p.unusable).length} 台</div></div></div>
<div class="section-head"><h2>区画運行状況</h2><button class="small ghost" data-go="zones">区画管理へ →</button></div><div class="cards">${state.zones.map(zoneCardHTML).join('')||'<div class="empty">区画がありません。設定から追加してください。</div>'}</div>
<div class="section-head"><h2>直近の通知</h2><button class="small ghost" data-go="notices">通知一覧へ →</button></div>${state.notices.slice(0,4).map(noticeHTML).join('')||'<div class="empty">通知はありません。</div>'}`}
function zoneCardHTML(z){const g=groupById(z.groupId),ms=elapsed(z),t=effectiveTimes(z,g),over=ms>=t.warning&&['active','paused'].includes(z.status),warn=ms>=t.standard&&['active','paused'].includes(z.status);return `<article class="zone-card"><div class="card-head"><div><h3>${esc(z.name)}</h3><div class="tiny muted">${g?`#${g.no} ${esc(g.name||'名称なし')}`:'グループ未割当'}</div></div><span class="status ${statusClass(z.status)}">${statusLabel(z.status)}</span></div>${['active','paused'].includes(z.status)?`<div class="timer ${over?'over':warn?'warn':''}" data-zone-timer="${z.id}">${fmt(ms)}</div><div class="tiny muted">${over?'⚠ 警告時間を超過':warn?'● 標準時間に到達':'体験経過時間'} ／ 標準 ${t.standard/60000}分・警告 ${t.warning/60000}分</div>`:z.status==='finished'?`<div class="timer">${fmt(z.finalMs||0)}</div><div class="tiny muted">最終体験時間 ／ ${dateTime(z.finishedAt)}</div>`:`<div class="timer muted">00:00:00</div><div class="tiny muted">次のグループを割り当てできます</div>`}<div class="actions">${z.status==='free'?`<select aria-label="${esc(z.name)}に割り当てるグループ" id="assign-${z.id}" style="flex:1;min-width:150px">${groupOptionList()}</select><button class="primary" data-action="start-zone" data-id="${z.id}">▶ 開始</button>`:''}${z.status==='active'?`<button class="warning" data-action="pause-zone" data-id="${z.id}">Ⅱ 一時停止</button><button class="success" data-action="finish-zone" data-id="${z.id}">■ 終了</button>`:''}${z.status==='paused'?`<button class="primary" data-action="resume-zone" data-id="${z.id}">▶ 再開</button><button class="success" data-action="finish-zone" data-id="${z.id}">■ 終了</button>`:''}${z.status==='finished'?`<button class="ghost" data-action="clear-zone" data-id="${z.id}">区画を空きに戻す</button>`:''}</div></article>`}
function zonesHTML(){return `<div class="section-head"><h2>体験区画一覧</h2><span class="pill">${state.zones.length} 区画</span></div><div class="cards">${state.zones.map(zoneCardHTML).join('')||'<div class="empty">区画がありません。</div>'}</div><div class="panel" style="margin-top:15px"><h3>区画の追加</h3><div class="formrow"><div class="field"><label>区画名</label><input id="newZoneName" placeholder="例：区画3"></div><button class="primary" data-action="add-zone">＋ 区画を追加</button></div><p class="help">使用中・一時停止中の区画は削除できません。終了済みの記録はグループ履歴に残ります。</p></div>`}
function groupsHTML(){const waiting=state.groups.filter(g=>['registered','waiting'].includes(g.status)),running=activeGroups(),done=state.groups.filter(g=>['done','cancelled'].includes(g.status));return `<div class="panel"><h3>新しいグループを受付</h3><div class="formrow"><div class="field"><label>グループ名（任意）</label><input id="groupName" maxlength="40" placeholder="例：家族3名"></div><button class="primary" data-action="register-group">＋ 受付登録</button></div><p class="help">登録番号は自動で連番になります。受付登録後、区画画面から体験を開始できます。</p></div><div class="section-head"><h2>待機中 <span class="pill">${waiting.length}</span></h2></div>${waiting.map(groupCardHTML).join('')||'<div class="empty">待機中のグループはありません。</div>'}<div class="section-head"><h2>体験中・一時停止 <span class="pill">${running.length}</span></h2></div>${running.map(groupCardHTML).join('')||'<div class="empty">体験中のグループはありません。</div>'}<div class="section-head"><h2>終了・キャンセル履歴 <span class="pill">${done.length}</span></h2></div>${done.slice().reverse().map(groupCardHTML).join('')||'<div class="empty">履歴はまだありません。</div>'}`}
function groupCardHTML(g){const z=g.zoneId?zoneById(g.zoneId):null,ms=groupElapsed(g),t=effectiveTimes(z,g),active=['active','paused'].includes(g.status);return `<article class="group-card" style="margin-bottom:9px"><div class="card-head"><div><h3>#${g.no} ${esc(g.name||'（名称なし）')}</h3><div class="tiny muted">受付 ${dateTime(g.registeredAt)} ${z?'／ '+esc(z.name):''}</div></div><span class="status ${statusClass(g.status)}">${statusLabel(g.status)}</span></div>${active||g.status==='done'?`<div class="timer ${['active','paused'].includes(g.status)&&ms>=t.warning?'over':['active','paused'].includes(g.status)&&ms>=t.standard?'warn':''}" ${active?`data-group-timer="${g.id}"`:''}>${fmt(g.status==='done'?(g.finalMs||ms):ms)}</div><div class="tiny muted">${g.status==='done'?'最終体験時間':`標準 ${t.standard/60000}分 ／ 警告 ${t.warning/60000}分`}</div>`:''}<div class="actions">${g.status==='registered'?`<button class="small" data-action="mark-waiting" data-id="${g.id}">待機中にする</button><button class="small danger" data-action="cancel-group" data-id="${g.id}">キャンセル</button>`:''}${g.status==='waiting'?`<button class="small danger" data-action="cancel-group" data-id="${g.id}">キャンセル</button>`:''}${g.status==='done'||g.status==='cancelled'?`<span class="tiny muted">${g.status==='done'?'終了':'取消'} ${dateTime(g.finishedAt||g.cancelledAt)}</span>`:''}</div><div class="formrow" style="margin-top:10px"><div class="field"><label>個別 標準時間（分・空欄は共通）</label><input type="number" min="1" max="240" data-group-setting="standard" data-id="${g.id}" value="${g.standardOverride??''}" placeholder="${state.settings.standardMin}"></div><div class="field"><label>個別 警告時間（分・空欄は共通）</label><input type="number" min="2" max="300" data-group-setting="warning" data-id="${g.id}" value="${g.warningOverride??''}" placeholder="${state.settings.warningMin}"></div><button class="small" data-action="save-group-times" data-id="${g.id}">時間を保存</button></div></article>`}
function ipadsHTML(){return `<div class="grid"><div class="metric"><div class="label">登録台数</div><div class="value">${state.ipads.length}</div></div><div class="metric"><div class="label">保管中</div><div class="value">${state.ipads.filter(p=>!p.onLoan&&!p.unusable).length}</div></div><div class="metric"><div class="label">貸出中</div><div class="value">${state.ipads.filter(p=>p.onLoan).length}</div></div><div class="metric"><div class="label">充電中</div><div class="value">${state.ipads.filter(p=>p.charging).length}</div></div></div><div class="section-head"><h2>端末一覧</h2></div><div class="cards">${state.ipads.map(ipadCardHTML).join('')||'<div class="empty">iPadが登録されていません。</div>'}</div><div class="panel" style="margin-top:15px"><h3>iPadを追加</h3><div class="formrow"><div class="field"><label>端末名</label><input id="newIpadName" placeholder="例：iPad 5"></div><button class="primary" data-action="add-ipad">＋ 端末を追加</button></div></div>`}
function ipadCardHTML(p){const g=groupById(p.groupId),long=p.onLoan&&p.loanAt&&now()-p.loanAt>=state.settings.ipadLongLoanMin*60000;return `<article class="ipad-card"><div class="card-head"><div><h3>▤ ${esc(p.name)}</h3><div class="tiny muted">${p.onLoan?'貸出先：'+(g?'#'+g.no+' '+esc(g.name||'名称なし'):'未指定'):'最終返却 '+dateTime(p.returnAt)}</div></div><span class="status ${p.unusable?'st-alert':p.onLoan?'st-active':'st-free'}">${p.unusable?'使用不可':p.onLoan?'貸出中':'保管中'}</span></div><div class="details"><div class="detail"><div class="k">充電状態</div><div class="v">${p.charging?'⚡ 充電中':'充電していない'}</div></div><div class="detail"><div class="k">貸出経過</div><div class="v mono" ${p.onLoan?`data-ipad-timer="${p.id}"`:''}>${p.onLoan?fmt(now()-p.loanAt):'—'}</div></div><div class="detail"><div class="k">貸出開始</div><div class="v">${dateTime(p.loanAt)}</div></div><div class="detail"><div class="k">状態</div><div class="v">${p.onLoan&&p.charging?'⚠ 貸出中に充電中':long?'⚠ 長時間貸出':'正常'}</div></div></div><div class="actions">${!p.onLoan&&!p.unusable?`<select id="ipad-group-${p.id}" style="flex:1;min-width:140px"><option value="">貸出先（任意）</option>${state.groups.filter(g=>!['done','cancelled'].includes(g.status)).map(g=>`<option value="${g.id}">#${g.no} ${esc(g.name||'名称なし')}</option>`).join('')}</select><button class="primary" data-action="loan-ipad" data-id="${p.id}">貸出</button>`:''}${p.onLoan?`<button class="success" data-action="return-ipad" data-id="${p.id}">✓ 返却</button>`:''}<button class="small ${p.charging?'warning':'ghost'}" data-action="toggle-charge" data-id="${p.id}">${p.charging?'⚡ 充電を解除':'⚡ 充電中にする'}</button><button class="small ${p.unusable?'success':'ghost'}" data-action="toggle-unusable" data-id="${p.id}">${p.unusable?'使用可能にする':'使用不可にする'}</button><button class="small ghost" data-action="rename-ipad" data-id="${p.id}">名称変更</button><button class="small danger" data-action="remove-ipad" data-id="${p.id}" ${p.onLoan?'disabled':''}>削除</button></div>${p.onLoan&&p.charging?'<p class="help" style="color:var(--yellow)">⚠ 貸出中の端末が充電中に設定されています。状態を確認してください。</p>':''}</article>`}
function noticeHTML(n){return `<article class="notice ${n.type==='critical'?'critical':n.type==='info'?'info':''}"><div class="notice-top"><strong>${esc(n.title)}</strong><span class="pill">${n.read?'確認済み':'未確認'}</span></div><p>${esc(n.message)}</p><div class="notice-top"><time>${dateTime(n.at)}</time>${n.read?'':`<button class="small" data-action="read-notice" data-id="${n.id}">確認済みにする</button>`}</div></article>`}
function noticesHTML(){return `<div class="section-head"><h2>通知センター</h2><div class="toolbar"><span class="pill">未確認 ${state.notices.filter(n=>!n.read).length} 件</span><button class="small" data-action="read-all">すべて確認済み</button></div></div>${state.notices.map(noticeHTML).join('')||'<div class="empty">通知はありません。</div>'}`}
function settingsHTML(){return `<div class="two-col"><section class="panel"><h3>時間設定</h3><div class="formrow"><div class="field"><label>標準時間（分）</label><input id="standardMin" type="number" min="1" max="240" value="${state.settings.standardMin}"></div><div class="field"><label>警告時間（分）</label><input id="warningMin" type="number" min="2" max="300" value="${state.settings.warningMin}"></div></div><p class="help">初期値は標準15分・警告20分。変更は保存後、進行中の体験にも即時適用されます。経過時間はリセットされません。</p><button class="primary" data-action="save-global-times">時間設定を保存</button><div class="setting-item"><h4>長時間貸出の通知</h4><div class="formrow"><div class="field"><label>通知する経過時間（分）</label><input id="ipadLongLoanMin" type="number" min="1" max="1440" value="${state.settings.ipadLongLoanMin}"></div><button class="small" data-action="save-loan-setting">保存</button></div></div></section>
<section class="panel"><h3>イベント設定</h3><div class="field"><label>終了予定日時</label><input id="eventEndAt" type="datetime-local" value="${state.settings.eventEndAt}"></div><div class="field" style="margin-top:10px"><label>終了予告（何分前）</label><input id="eventNoticeMin" type="number" min="1" max="240" value="${state.settings.eventNoticeMin}"></div><button class="primary" style="margin-top:10px" data-action="save-event-settings">イベント設定を保存</button><p class="help">終了予定の通知はイベント運行中に一度だけ発生します。</p></section></div>
<section class="panel"><h3>区画設定</h3>${state.zones.map(z=>`<div class="list-row"><div style="flex:1"><input data-zone-name="${z.id}" value="${esc(z.name)}" aria-label="区画名"></div><div style="width:100px"><input type="number" min="1" max="240" data-zone-standard="${z.id}" value="${z.standardOverride??''}" placeholder="共通" aria-label="区画標準時間"></div><div style="width:100px"><input type="number" min="2" max="300" data-zone-warning="${z.id}" value="${z.warningOverride??''}" placeholder="共通" aria-label="区画警告時間"></div><button class="small" data-action="save-zone-setting" data-id="${z.id}">保存</button><button class="small danger" data-action="remove-zone" data-id="${z.id}" ${['active','paused'].includes(z.status)?'disabled':''}>削除</button></div>`).join('')}<p class="help">入力欄は「区画名・個別標準時間・個別警告時間」の順です。個別時間を空欄にすると共通設定を使います。稼働中区画は削除できません。</p><div class="formrow"><div class="field"><label>新しい区画名</label><input id="settingNewZoneName" placeholder="例：区画3"></div><button class="primary" data-action="add-zone-setting">＋ 区画追加</button></div></section>
<section class="panel"><h3>データ管理</h3><div class="toolbar"><button class="primary" data-action="export">⬇ JSONバックアップ</button><label class="small" style="display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer">⬆ JSON復元<input id="importFile" type="file" accept="application/json,.json" hidden></label><button class="danger" data-action="reset">初期化</button></div><p class="help">バックアップには設定・区画・グループ・iPad・通知・履歴が含まれます。復元すると現在のデータは上書きされます。</p><div class="setting-item"><h4>保存・同期の状態</h4><div class="tagline">保存先：このブラウザの localStorage ／ 同期：未実装 ／ オフライン基本操作：対応</div></div></section>
<section class="panel"><h3>QRコード用リンク（画面を開くだけ）</h3><p class="help">このHTMLをWebサーバーなどに配置したURLに画面識別子を付けたリンクです。リンクをQRコード化する場合は、別途QR生成手段が必要です。ローカルファイルの file:// URL は端末間共有には使えません。</p>${[['dashboard','運行状況'],['zones','体験区画'],['groups','受付'],['ipads','iPad管理'],['notices','通知センター'],['settings','設定']].map(([id,label])=>{const u=location.href.split('?')[0]+'?screen='+id;return `<div class="list-row"><div><strong>${label}</strong><div class="qr-link">${esc(u)}</div></div><button class="small" data-copy-url="${esc(u)}">リンクをコピー</button></div>`}).join('')}<p class="help">QR読み取り時は指定画面を開くだけで、受付・貸出・体験開始などの操作は実行しません。QR画像の自動生成・印刷機能は未実装です。</p></section>`}
function startZone(id,groupId){const z=zoneById(id),g=groupById(groupId);if(!z||z.status!=='free'||!g||!['registered','waiting'].includes(g.status)||g.zoneId){showToast('区画またはグループの状態を確認してください');return}z.status='active';z.groupId=g.id;z.startAt=now();z.elapsedMs=0;z.finishedAt=null;z.finalMs=null;z.notified={standard:false,warning:false};g.status='active';g.zoneId=z.id;g.startAt=z.startAt;g.elapsedMs=0;addNotice('info','体験開始',`${z.name}でグループ #${g.no} の体験を開始しました`,z.id);save();render();}
function pauseZone(id){const z=zoneById(id);if(!z||z.status!=='active')return;z.elapsedMs=elapsed(z);z.startAt=null;z.status='paused';const g=groupById(z.groupId);if(g)g.status='paused';save();render()}
function resumeZone(id){const z=zoneById(id);if(!z||z.status!=='paused')return;z.status='active';z.startAt=now();const g=groupById(z.groupId);if(g)g.status='active';save();render()}
function finishZone(id){const z=zoneById(id);if(!z||!['active','paused'].includes(z.status))return;const ms=elapsed(z),g=groupById(z.groupId);z.finalMs=ms;z.finishedAt=now();z.elapsedMs=ms;z.startAt=null;z.status='finished';if(g){g.status='done';g.finalMs=ms;g.elapsedMs=ms;g.finishedAt=z.finishedAt;g.zoneId=z.id}addNotice('info','体験終了',`${z.name}${g?'・グループ #'+g.no:''} の体験が終了しました。使用時間 ${fmt(ms)}`,z.id);state.history.push({type:'experience',zoneId:z.id,groupId:g?.id||null,at:z.finishedAt,durationMs:ms});save();render()}
function clearZone(id){const z=zoneById(id);if(!z||z.status!=='finished')return;if(!confirm(`${z.name}を空き状態に戻しますか？終了履歴は残ります。`))return;Object.assign(z,{status:'free',groupId:null,startAt:null,elapsedMs:0,finishedAt:null,finalMs:null,notified:{standard:false,warning:false}});save();render()}
function registerGroup(){const name=$('#groupName').value.trim();const g={id:uid(),no:state.nextGroupNo++,name,registeredAt:now(),status:'registered',zoneId:null,startAt:null,elapsedMs:0,finalMs:null,finishedAt:null,standardOverride:null,warningOverride:null};state.groups.push(g);addNotice('info','受付登録',`グループ #${g.no}${name?'（'+name+'）':''} を登録しました`,g.id);save();render();showToast(`グループ #${g.no} を受付登録しました`)}
function loanIpad(id){const p=ipadById(id);if(!p||p.onLoan||p.unusable)return;const gid=$('#ipad-group-'+id)?.value||null;p.onLoan=true;p.loanAt=now();p.returnAt=null;p.groupId=gid;p.loanNoticeSent=false;if(p.charging){p._chargeNotice=true;addNotice('critical','貸出中のiPadが充電中',`${p.name}は充電中のまま貸し出されました。状態を確認してください`,id);}save();render()}
function returnIpad(id){const p=ipadById(id);if(!p||!p.onLoan)return;p.onLoan=false;p.returnAt=now();p.loanAt=null;p.groupId=null;p.loanNoticeSent=false;save();render()}
function tick(){const n=now();let changed=false;for(const z of state.zones){if(!['active','paused'].includes(z.status))continue;const g=groupById(z.groupId),ms=elapsed(z),t=effectiveTimes(z,g);if(ms>=t.standard&&!z.notified.standard){z.notified.standard=true;addNotice('warning','標準時間に到達',`${z.name}${g?'・グループ #'+g.no:''} が標準時間 ${t.standard/60000}分に到達しました`,z.id);changed=true}if(ms>=t.warning&&!z.notified.warning){z.notified.warning=true;addNotice('critical','警告時間に到達',`${z.name}${g?'・グループ #'+g.no:''} が警告時間 ${t.warning/60000}分に到達しました。終了時刻を確認してください`,z.id);changed=true}}
for(const p of state.ipads){if(p.onLoan&&p.charging&&!p._chargeNotice){p._chargeNotice=true;addNotice('critical','貸出中のiPadが充電中',`${p.name}は貸出中かつ充電中です`,p.id);changed=true}if((!p.onLoan||!p.charging)&&p._chargeNotice){p._chargeNotice=false;changed=true}if(p.onLoan&&p.loanAt&&n-p.loanAt>=state.settings.ipadLongLoanMin*60000&&!p.loanNoticeSent){p.loanNoticeSent=true;addNotice('warning','iPad長時間貸出',`${p.name}の貸出が${state.settings.ipadLongLoanMin}分を超えています`,p.id);changed=true}}
if(state.event.status==='running'&&state.event.endAt&&!state.event.noticeSent&&state.event.endAt-n<=state.settings.eventNoticeMin*60000){state.event.noticeSent=true;const remain=state.event.endAt-n;addNotice('warning','イベント終了予定が近づいています',remain>=0?`終了予定時刻 ${dateTime(state.event.endAt)} まで残り${Math.ceil(remain/60000)}分です`:`終了予定時刻 ${dateTime(state.event.endAt)} を過ぎています`);changed=true}
$('#clock').textContent=new Date(n).toLocaleTimeString('ja-JP',{hour12:false});$('#today').textContent=new Date(n).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});renderHeader();for(const el of $$('[data-zone-timer]')){const z=zoneById(el.dataset.zoneTimer);if(z){el.textContent=fmt(elapsed(z));const t=effectiveTimes(z,groupById(z.groupId));el.classList.toggle('warn',elapsed(z)>=t.standard&&elapsed(z)<t.warning);el.classList.toggle('over',elapsed(z)>=t.warning)}}for(const el of $$('[data-group-timer]')){const g=groupById(el.dataset.groupTimer);if(g)el.textContent=fmt(groupElapsed(g))}for(const el of $$('[data-ipad-timer]')){const p=ipadById(el.dataset.ipadTimer);if(p&&p.loanAt)el.textContent=fmt(n-p.loanAt)}if(changed){save();if(['notices','dashboard','zones','groups','ipads'].includes(page))render()}}
function eventStart(){if(state.event.status==='running')return;if(!confirm('イベントを開始しますか？開始時刻を記録します。'))return;state.event.status='running';state.event.startAt=now();state.event.endAt=state.settings.eventEndAt?new Date(state.settings.eventEndAt).getTime():null;state.event.noticeSent=false;addNotice('info','イベント開始','イベント運営を開始しました');save();render()}
function eventEnd(){if(state.event.status!=='running')return;const active=state.zones.filter(z=>['active','paused'].includes(z.status)),loans=state.ipads.filter(p=>p.onLoan);let msg='イベントを終了しますか？';if(active.length||loans.length)msg+=`\n\n未処理項目があります：\n・体験中／一時停止：${active.length}区画\n・貸出中iPad：${loans.length}台\n\n終了後もこれらの状態と履歴は保持されます。`;else msg+='\n終了時刻を記録します。';if(!confirm(msg))return;state.event.status='ended';state.event.endAt=now();addNotice(active.length||loans.length?'critical':'info','イベント終了',`イベントを終了しました。未処理：体験${active.length}区画、iPad貸出${loans.length}台`);save();render()}
function saveGlobalTimes(){const s=Number($('#standardMin').value),w=Number($('#warningMin').value);if(!Number.isInteger(s)||!Number.isInteger(w)||s<1||s>240||w<2||w>300||w<=s){showToast('標準時間は1〜240分、警告時間は2〜300分で、警告時間を標準時間より長くしてください');return}for(const z of state.zones){const zs=z.standardOverride??s,zw=z.warningOverride??w;if(zw<=zs){showToast(`${z.name}の個別時間と矛盾します。区画設定を先に見直してください`);return}}for(const g of state.groups){const z=g.zoneId?zoneById(g.zoneId):null,gs=g.standardOverride??z?.standardOverride??s,gw=g.warningOverride??z?.warningOverride??w;if(gw<=gs){showToast(`グループ #${g.no} の個別時間と矛盾します。個別設定を見直してください`);return}}state.settings.standardMin=s;state.settings.warningMin=w;save();render();showToast('時間設定を保存しました。進行中の体験にも適用されます')}
function saveZoneSetting(id){const z=zoneById(id);if(!z)return;const name=$(`[data-zone-name="${id}"]`).value.trim(),sv=$(`[data-zone-standard="${id}"]`).value,wv=$(`[data-zone-warning="${id}"]`).value,s=sv===''?null:Number(sv),w=wv===''?null:Number(wv);if(!name){showToast('区画名を入力してください');return}if(s!==null&&(!Number.isInteger(s)||s<1||s>240)||w!==null&&(!Number.isInteger(w)||w<2||w>300)){showToast('個別時間は標準1〜240分、警告2〜300分で入力してください');return}const effS=s??state.settings.standardMin,effW=w??state.settings.warningMin;if(effW<=effS){showToast('警告時間は標準時間より長くしてください');return}for(const g of state.groups.filter(g=>g.zoneId===id)){const gs=g.standardOverride??effS,gw=g.warningOverride??effW;if(gw<=gs){showToast(`グループ #${g.no} の個別時間と矛盾します`);return}}z.name=name;z.standardOverride=s;z.warningOverride=w;save();render();showToast('区画設定を保存しました')}
function saveGroupTimes(id){const g=groupById(id);if(!g)return;const sEl=$(`[data-group-setting="standard"][data-id="${id}"]`),wEl=$(`[data-group-setting="warning"][data-id="${id}"]`);const s=sEl.value===''?null:Number(sEl.value),w=wEl.value===''?null:Number(wEl.value);if(s!==null&&(!Number.isInteger(s)||s<1||s>240)||w!==null&&(!Number.isInteger(w)||w<2||w>300)){showToast('個別時間の入力値が範囲外です');return}const z=g.zoneId?zoneById(g.zoneId):null,effS=s??z?.standardOverride??state.settings.standardMin,effW=w??z?.warningOverride??state.settings.warningMin;if(effW<=effS){showToast('警告時間は標準時間より長くしてください');return}g.standardOverride=s;g.warningOverride=w;save();render();showToast('グループ個別時間を保存しました')}
function addZone(name){name=(name||'').trim();if(state.zones.length>=20){showToast('区画は最大20区画です');return}if(!name)name='区画'+(state.zones.length+1);state.zones.push({id:uid(),name,status:'free',groupId:null,startAt:null,elapsedMs:0,finishedAt:null,finalMs:null,notified:{standard:false,warning:false},standardOverride:null,warningOverride:null});save();render();showToast('区画を追加しました')}
function removeZone(id){const z=zoneById(id);if(!z||['active','paused'].includes(z.status))return;if(!confirm(`${z.name}を削除しますか？関連する終了履歴は残ります。`))return;state.zones=state.zones.filter(x=>x.id!==id);save();render()}
function addIpad(name){name=(name||'').trim();if(state.ipads.length>=50){showToast('iPadは最大50台です');return}if(!name)name='iPad '+(state.ipads.length+1);state.ipads.push({id:uid(),name,onLoan:false,charging:false,unusable:false,loanAt:null,returnAt:null,groupId:null,loanNoticeSent:false});save();render()}
function removeIpad(id){const p=ipadById(id);if(!p||p.onLoan)return;if(!confirm(`${p.name}を削除しますか？`))return;state.ipads=state.ipads.filter(x=>x.id!==id);save();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='railway-minecraft-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);showToast('JSONバックアップを作成しました')}
function validImport(x){if(!x||x.version!==1||!Array.isArray(x.zones)||!Array.isArray(x.groups)||!Array.isArray(x.ipads)||!x.settings||!x.event)throw new Error('ファイル形式またはバージョンが異なります');if(x.zones.length>20||x.ipads.length>50||x.groups.length>10000)throw new Error('登録件数が上限を超えています');for(const z of x.zones){if(typeof z.id!=='string'||typeof z.name!=='string'||!['free','active','paused','finished'].includes(z.status))throw new Error('区画データに不正な値があります')}for(const g of x.groups){if(typeof g.id!=='string'||!Number.isInteger(g.no)||!['registered','waiting','active','paused','done','cancelled'].includes(g.status))throw new Error('グループデータに不正な値があります')}for(const p of x.ipads){if(typeof p.id!=='string'||typeof p.name!=='string'||typeof p.onLoan!=='boolean'||typeof p.charging!=='boolean')throw new Error('iPadデータに不正な値があります')}const s=x.settings;if(!Number.isInteger(s.standardMin)||!Number.isInteger(s.warningMin)||s.standardMin<1||s.warningMin<=s.standardMin)throw new Error('時間設定が不正です');const gids=x.groups.map(g=>g.id);if(new Set(gids).size!==gids.length)throw new Error('グループIDが重複しています');const zids=x.zones.map(z=>z.id);if(new Set(zids).size!==zids.length)throw new Error('区画IDが重複しています');const pids=x.ipads.map(p=>p.id);if(new Set(pids).size!==pids.length)throw new Error('iPad IDが重複しています');for(const z of x.zones)if(z.groupId&&!gids.includes(z.groupId))throw new Error('区画に存在しないグループが割り当てられています');return true}
function importData(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);validImport(x);if(!confirm('現在の管理データを、選択したバックアップの内容で上書きして復元しますか？'))return;state=normalizeLoaded(x);save();render();showToast('バックアップを復元しました')}catch(e){showToast('復元できません：'+e.message)}};r.onerror=()=>showToast('ファイルを読み込めませんでした');r.readAsText(file)}
function resetAll(){if(!confirm('すべての区画・グループ・iPad・通知・設定を初期化します。元に戻せません。実行しますか？'))return;state=freshState();save();render();showToast('初期化しました')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#view').addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){page=go.dataset.go;$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();return}const copy=e.target.closest('[data-copy-url]');if(copy){navigator.clipboard?.writeText(copy.dataset.copyUrl).then(()=>showToast('リンクをコピーしました')).catch(()=>showToast('コピーできません。URLを選択してコピーしてください'));return}const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case'start-zone':startZone(id,$('#assign-'+id)?.value);break;case'pause-zone':pauseZone(id);break;case'resume-zone':resumeZone(id);break;case'finish-zone':if(confirm('この体験を終了しますか？使用時間を記録します。'))finishZone(id);break;case'clear-zone':clearZone(id);break;case'add-zone':addZone($('#newZoneName').value);break;case'add-zone-setting':addZone($('#settingNewZoneName').value);break;case'register-group':registerGroup();break;case'mark-waiting':{const g=groupById(id);if(g&&g.status==='registered'){g.status='waiting';save();render()}}break;case'cancel-group':{const g=groupById(id);if(g&&!g.zoneId&&confirm(`グループ #${g.no} をキャンセルしますか？`)){g.status='cancelled';g.cancelledAt=now();save();render()}}break;case'save-group-times':saveGroupTimes(id);break;case'loan-ipad':loanIpad(id);break;case'return-ipad':if(confirm('このiPadを返却済みにしますか？'))returnIpad(id);break;case'toggle-charge':{const p=ipadById(id);if(p){p.charging=!p.charging;if(p.onLoan&&p.charging){p._chargeNotice=true;addNotice('critical','貸出中のiPadが充電中',`${p.name}は貸出中かつ充電中です`,p.id);}save();render()}}break;case'toggle-unusable':{const p=ipadById(id);if(p){p.unusable=!p.unusable;save();render()}}break;case'rename-ipad':{const p=ipadById(id);if(p){const n=prompt('新しい端末名',p.name);if(n!==null&&n.trim()){p.name=n.trim();save();render()}}}break;case'remove-ipad':removeIpad(id);break;case'read-notice':{const n=state.notices.find(x=>x.id===id);if(n){n.read=true;save();render()}}break;case'read-all':state.notices.forEach(n=>n.read=true);save();render();break;case'save-global-times':saveGlobalTimes();break;case'save-zone-setting':saveZoneSetting(id);break;case'remove-zone':removeZone(id);break;case'save-loan-setting':{const n=Number($('#ipadLongLoanMin').value);if(!Number.isInteger(n)||n<1||n>1440){showToast('1〜1440分で入力してください');break}state.settings.ipadLongLoanMin=n;state.ipads.forEach(p=>{if(p.onLoan&&p.loanAt&&now()-p.loanAt<n*60000)p.loanNoticeSent=false});save();showToast('貸出通知設定を保存しました')}break;case'save-event-settings':{const v=$('#eventEndAt').value,n=Number($('#eventNoticeMin').value);if(!Number.isInteger(n)||n<1||n>240){showToast('終了予告は1〜240分で入力してください');break}if(v&&new Date(v).getTime()<=now()){showToast('終了予定日時は現在より後にしてください');break}state.settings.eventEndAt=v;state.settings.eventNoticeMin=n;if(state.event.status==='running')state.event.endAt=v?new Date(v).getTime():null;state.event.noticeSent=false;save();render();showToast('イベント設定を保存しました')}break;case'export':exportData();break;case'reset':resetAll();break;case'add-ipad':addIpad($('#newIpadName').value);break;}
});
$('#view').addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0])importData(e.target.files[0])});
$('#eventStartBtn').addEventListener('click',eventStart);$('#eventEndBtn').addEventListener('click',eventEnd);
window.addEventListener('online',()=>{renderHeader();showToast('オンラインに戻りました。ローカル保存データはこの端末内にあります')});window.addEventListener('offline',()=>{renderHeader();showToast('オフラインです。ローカル機能は引き続き使用できます')});
const screen=new URLSearchParams(location.search).get('screen');if(screen!==null){if(['dashboard','zones','groups','ipads','notices','settings'].includes(screen))page=screen;else setTimeout(()=>showToast('画面識別子が不正です。運行状況を表示します'),300)}$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();tick();setInterval(tick,1000);
</script>
